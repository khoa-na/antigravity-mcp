[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-agent"
version = "3.0.0"
description = "Skill + CLI that lets Claude Code (or any shell-capable harness) delegate coding tasks to the Google Antigravity agent (Gemini)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Laimusp"},
    {name = "Antigravity Community"}
]
keywords = ["antigravity", "gemini", "claude-code", "skill", "agent", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
antigravity-doctor = "doctor:main"
antigravity-agent = "agy_agent:main"
antigravity-agent-hook = "agy_hooks:main"

[tool.setuptools]
py-modules = ["agy_agent", "agy_backend", "agy_hooks", "doctor"]
